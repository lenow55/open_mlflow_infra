services:
  postgres:
    image: postgres:18-alpine
    env_file: ./postgres/postgres.env
    ports:
      - 8533:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "sh -c 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'",
        ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  psql-init:
    image: lenow/sql-initer:v2.4 # ваш образ с хаба
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./postgres/projects_db_configs.json:/app/config.json
    restart: "no"

  s3-backup-restore:
    image: busybox
    volumes:
      - ./rustfs/backup-restore.sh:/backup-restore.sh:ro
      - ./s3_data:/backup
      - rustfs_data:/data
    environment:
      BACKUP: 0
    entrypoint:
      - sh
      - /backup-restore.sh
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9574:9000"
      # RustFS Console: http://localhost:9321
      - "9321:9001"
    env_file: ./rustfs/rustfs.env
    depends_on:
      s3-backup-restore:
        condition: service_completed_successfully
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - rustfs_data:/data

  rustfs-create-bucket:
    image: rustfs/rc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    env_file: ./rustfs/rustfs.env
    entrypoint:
      - sh
      - /rustfs_init.sh
    volumes:
      - ./rustfs/buckets_list.txt:/buckets_list
      - ./rustfs/rustfs_init.sh:/rustfs_init.sh
    restart: "no"

volumes:
  rustfs_data:
  backup_restore:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "./s3_data"
  postgres_data:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "./postgres_data"
